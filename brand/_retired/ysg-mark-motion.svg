<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     role="img" aria-label="YSG Audio Tools">
  <defs>
    <linearGradient id="ysgm-down" gradientUnits="userSpaceOnUse" x1="12.00" y1="9.78" x2="12.00" y2="19.68"><stop offset="0" stop-color="#34E0E8"/><stop offset="1" stop-color="#2C6BE0"/></linearGradient>
    <linearGradient id="ysgm-upleft" gradientUnits="userSpaceOnUse" x1="12.00" y1="9.78" x2="3.43" y2="4.83"><stop offset="0" stop-color="#2C6BE0"/><stop offset="1" stop-color="#1B2A6B"/></linearGradient>
    <linearGradient id="ysgm-upright" gradientUnits="userSpaceOnUse" x1="12.00" y1="9.78" x2="20.57" y2="4.83"><stop offset="0" stop-color="#34E0E8"/><stop offset="1" stop-color="#2C6BE0"/></linearGradient>
    <radialGradient id="ysgm-core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#34E0E8" stop-opacity="0.95"/><stop offset="0.55" stop-color="#34E0E8" stop-opacity="0.35"/><stop offset="1" stop-color="#34E0E8" stop-opacity="0"/></radialGradient>
    <clipPath id="ysgm-grow"><circle cx="12.000" cy="9.785" r="12" class="grow"/></clipPath>
  </defs>
  <style>
    /* ⚠ 모든 keyframes 의 **0% 를 완성 상태**로 둔다. 조금 뒤(4%)에서 시작 상태로
       점프한 다음 다시 완성으로 간다.

       왜 이 순서인가: 애니메이션이 등록된 뒤 렌더가 진행되지 않는 상황(창이 가려짐,
       썸네일 캡처, 정적 렌더러)에서는 화면이 **첫 프레임에 멈춘다.** 처음에
       'r:0 / opacity:0' 같은 시작 상태를 두면 그 환경에서 로고가 아예 사라진다 —
       실제로 그렇게 만들어 두 번 빈 화면을 봤다. 0% 를 완성으로 두면 멈춰도
       정지 로고가 남는다. 이 구조를 뒤집지 말 것. */
    @media (prefers-reduced-motion: reduce) {
      .grow, .core, .w, .tick, .dot { animation: none !important; }
    }

    .grow { animation: grow 2.4s cubic-bezier(.22,.9,.24,1) infinite; }
    @keyframes grow { 0% { r: 13 } 4% { r: 0 } 48%,100% { r: 13 } }

    .core { opacity: .8; transform-origin: 12.000px 9.785px;
            animation: core 2.4s ease-out infinite; }
    @keyframes core { 0% { opacity:.8; transform:scale(1) }
                      4% { opacity:0; transform:scale(.4) }
                      20% { opacity:.95; transform:scale(1.06) }
                      36%,100% { opacity:.8; transform:scale(1) } }

    .w { opacity: 1; animation: fade 2.4s ease-out infinite; }
    .w0 { animation-delay: .10s } .w1 { animation-delay: .21s } .w2 { animation-delay: .32s }
    @keyframes fade { 0% { opacity:1 } 4% { opacity:0 } 26%,100% { opacity:1 } }

    .tick { opacity: .55; animation: tick 2.4s ease-out infinite; }
    .t0 { animation-delay: .88s } .t1 { animation-delay: .99s } .t2 { animation-delay: 1.10s }
    @keyframes tick { 0% { opacity:.55 } 4% { opacity:0 }
                      10% { opacity:1 } 20%,100% { opacity:.55 } }

    .dot { opacity: 1; transform-origin: 12.000px 9.785px;
           animation: dot 2.4s ease-out infinite; animation-delay: 1.22s; }
    @keyframes dot { 0% { opacity:1; transform:scale(1) }
                     4% { opacity:0; transform:scale(.2) }
                     12% { opacity:1; transform:scale(1.9) }
                     24%,100% { opacity:1; transform:scale(1) } }
  </style>

  <circle class="core" cx="12.000" cy="9.785" r="7.4" fill="url(#ysgm-core)"
          style="transform-origin:12.000px 9.785px"/>
  <g clip-path="url(#ysgm-grow)">
      <path class="w w0" d="M 9.400 9.785 L 11.400 19.685 L 12.600 19.685 L 14.600 9.785 Z" fill="url(#ysgm-down)"/>
      <path class="w w1" d="M 13.300 7.533 L 3.726 4.315 L 3.126 5.354 L 10.700 12.036 Z" fill="url(#ysgm-upleft)"/>
      <path class="w w2" d="M 13.300 12.036 L 20.874 5.354 L 20.274 4.315 L 10.700 7.533 Z" fill="url(#ysgm-upright)"/>
  </g>
    <line class="tick t0" x1="11.10" y1="20.40" x2="12.90" y2="20.40" stroke="#34E0E8" stroke-width="0.42" stroke-linecap="round"/>
    <line class="tick t1" x1="3.25" y1="3.70" x2="2.35" y2="5.25" stroke="#34E0E8" stroke-width="0.42" stroke-linecap="round"/>
    <line class="tick t2" x1="21.65" y1="5.25" x2="20.75" y2="3.70" stroke="#34E0E8" stroke-width="0.42" stroke-linecap="round"/>
  <circle class="dot" cx="12.000" cy="9.785" r="0.72" fill="#FFB454"/>
</svg>
